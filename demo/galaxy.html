<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<title>Particle Galaxy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center; z-index: 10;
  }
  button {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 18px; border-radius: 999px; cursor: pointer;
    font-size: 13px; backdrop-filter: blur(10px); transition: all .2s;
  }
  button:hover, button.active { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
  #info {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.3); font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; pointer-events: none;
  }
  #fps {
    position: fixed; top: 20px; right: 20px;
    color: rgba(255,255,255,0.2); font-size: 11px; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button class="active" onclick="setMode('galaxy')">Galassia</button>
  <button onclick="setMode('vortex')">Vortice</button>
  <button onclick="setMode('explode')">Esplosione</button>
  <button onclick="setMode('web')">Rete neurale</button>
</div>
<div id="info">Muovi il mouse · Clicca per attirare</div>
<div id="fps"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

let mouse = { x: W/2, y: H/2, down: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup',   () => mouse.down = false);
canvas.addEventListener('touchmove', e => { e.preventDefault(); mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive:false});

let mode = 'galaxy';
function setMode(m) {
  mode = m;
  document.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(m) || (m==='web' && b.textContent.includes('rete')) || (m==='explode' && b.textContent.includes('splos')) || (m==='vortex' && b.textContent.includes('ortice')) || (m==='galaxy' && b.textContent.includes('alass'))));
  particles.forEach(p => p.reset());
}

const N = 1800;
const COLORS = [
  [120, 180, 255],  // blue
  [200, 130, 255],  // purple
  [255, 180, 100],  // orange
  [100, 255, 200],  // cyan
  [255, 100, 150],  // pink
];

class Particle {
  constructor(i) {
    this.i = i;
    this.reset();
  }
  reset() {
    const angle = Math.random() * Math.PI * 2;
    const arm   = (this.i % 3) * (Math.PI * 2 / 3);
    const r     = 80 + Math.pow(Math.random(), 0.5) * Math.min(W, H) * 0.38;
    const spread = r * 0.18;

    this.baseX = W/2 + Math.cos(angle * 0.3 + arm) * r + (Math.random()-0.5)*spread;
    this.baseY = H/2 + Math.sin(angle * 0.3 + arm) * r * 0.45 + (Math.random()-0.5)*spread;

    this.x  = this.baseX;
    this.y  = this.baseY;
    this.vx = 0;
    this.vy = 0;
    this.size = Math.random() * 1.8 + 0.3;

    const ci = Math.floor(Math.random() * COLORS.length);
    this.r = COLORS[ci][0]; this.g = COLORS[ci][1]; this.b = COLORS[ci][2];
    this.alpha = 0.4 + Math.random() * 0.6;
    this.speed = 0.3 + Math.random() * 0.7;
    this.angle = Math.random() * Math.PI * 2;
    this.orbitR = 60 + Math.random() * 200;
    this.orbitSpeed = (0.0005 + Math.random() * 0.001) * (Math.random()<0.5?1:-1);
  }

  update(t) {
    const cx = W/2, cy = H/2;
    let tx, ty;

    if (mode === 'galaxy') {
      this.angle += this.orbitSpeed * this.speed;
      tx = cx + Math.cos(this.angle) * this.orbitR;
      ty = cy + Math.sin(this.angle) * this.orbitR * 0.4;
    } else if (mode === 'vortex') {
      this.angle += 0.008 * this.speed;
      const pull = 1 - (Math.sin(t*0.0005) * 0.3 + 0.5);
      const or = this.orbitR * (0.3 + pull * 0.7);
      tx = cx + Math.cos(this.angle) * or;
      ty = cy + Math.sin(this.angle) * or;
    } else if (mode === 'explode') {
      const da = this.i / N * Math.PI * 2 * 7;
      const dr = 50 + (Math.sin(t * 0.001 + this.i) * 0.5 + 0.5) * Math.min(W,H) * 0.4;
      tx = cx + Math.cos(da) * dr;
      ty = cy + Math.sin(da) * dr;
    } else if (mode === 'web') {
      tx = this.baseX;
      ty = this.baseY;
    }

    // mouse attraction/repulsion
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    if (dist < 150) {
      const force = (150 - dist) / 150 * 3;
      if (mouse.down) {
        this.vx += (dx/dist) * force * 0.8;
        this.vy += (dy/dist) * force * 0.8;
      } else {
        this.vx -= (dx/dist) * force * 0.4;
        this.vy -= (dy/dist) * force * 0.4;
      }
    }

    this.vx += (tx - this.x) * 0.04;
    this.vy += (ty - this.y) * 0.04;
    this.vx *= 0.88;
    this.vy *= 0.88;
    this.x  += this.vx;
    this.y  += this.vy;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${this.r},${this.g},${this.b},${this.alpha})`;
    ctx.fill();
  }
}

const particles = Array.from({length: N}, (_, i) => new Particle(i));

// web mode connections
function drawConnections() {
  if (mode !== 'web') return;
  const DIST = 80;
  for (let i = 0; i < N; i++) {
    for (let j = i+1; j < N; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d  = dx*dx + dy*dy;
      if (d < DIST*DIST) {
        const a = (1 - Math.sqrt(d)/DIST) * 0.4;
        const p = particles[i];
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// Glow effect for mouse
function drawMouseGlow() {
  const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, mouse.down ? 120 : 60);
  g.addColorStop(0, mouse.down ? 'rgba(100,200,255,0.15)' : 'rgba(255,255,255,0.06)');
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

let last = 0, fps = 0, fpsEl = document.getElementById('fps');
function loop(t) {
  requestAnimationFrame(loop);

  // FPS
  fps = Math.round(1000 / (t - last) || 60);
  last = t;
  fpsEl.textContent = fps + ' fps';

  // Trail effect
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  drawMouseGlow();

  // Center glow
  const cg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 120);
  cg.addColorStop(0, 'rgba(180,120,255,0.12)');
  cg.addColorStop(1, 'transparent');
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, W, H);

  if (mode === 'web') drawConnections();

  particles.forEach(p => { p.update(t); p.draw(); });
}

requestAnimationFrame(loop);
</script>
</body>
</html>
